jenkins:
  systemMessage: "Jenkins — Projet Fil Rouge CICD (local devops stack)"
  numExecutors: 2
  mode: NORMAL
  scmCheckoutRetryCount: 2
  remotingSecurity:
    enabled: true
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: ${JENKINS_ADMIN_ID:-admin}
          password: ${JENKINS_ADMIN_PASSWORD:-admin}
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

unclassified:
  location:
    url: ${JENKINS_URL:-http://localhost:8080/}
  sonarGlobalConfiguration:
    installations:
      - name: "sonarqube"
        serverUrl: "http://sonarqube:9000"
        credentialsId: "sonar-token"

# sonar-scanner is baked into the Jenkins image at /usr/local/bin/sonar-scanner — no tool installer needed
